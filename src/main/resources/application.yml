spring:
  application:
    name: iitsm
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/iitsm}
    driver-class-name: org.h2.Driver
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
  h2:
    console:
      enabled: false
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${PORT:8080}

app:
  priority:
    thresholds:
      p1: 60
      p2: 30
      p3: 10
  sla:
    time-scale: ${APP_SLA_TIME_SCALE:1}
    monitor-interval-seconds: ${APP_SLA_MONITOR_INTERVAL_SECONDS:30}
    warning-threshold-percent: 80
  escalation:
    min-priority: ${APP_ESCALATION_MIN_PRIORITY:P1}
  notify:
    email:
      mode: ${APP_NOTIFY_EMAIL_MODE:simulated}
      from: ${SMTP_FROM:noreply@iitsm.local}
      log-file: ./data/email-notifications.log
    sms:
      log-file: ./data/sms-notifications.log
  ai:
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-2.5-flash}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

---
spring:
  config:
    activate:
      on-profile: dev
  h2:
    console:
      enabled: true
      path: /h2-console
