<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Sign In')}"></head>
<body>
<main class="container" style="max-width:480px;margin-top:3rem;">
    <article>
        <h2 style="margin-bottom:0.25rem;">I-ITSM Sign In</h2>
        <p><small>Intelligent IT Service Management &amp; Incident Resolution</small></p>
        <div th:if="${param.error}" class="flash flash-error">Invalid username or password, or account inactive.</div>
        <div th:if="${param.logout}" class="flash flash-success">Signed out successfully.</div>
        <div th:replace="~{fragments/layout :: alerts}"></div>

        <form th:action="@{/login}" method="post">
            <label>Username
                <input type="text" name="username" required autofocus/>
            </label>
            <label>Password
                <input type="password" name="password" required/>
            </label>
            <button type="submit">Sign In</button>
        </form>
        <p style="margin-top:1rem;">
            New employee? <a th:href="@{/register}">Register Employee Account</a>
        </p>
    </article>
</main>
</body>
</html>
